name: Build and Release

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        type: choice
        default: 'apk'
        options:
          - 'apk'
          - 'aab'
          - 'both'
      version_name:
        description: '版本号（如 1.0.0），用于 Release tag'
        required: false
        type: string
      create_release:
        description: '是否创建 GitHub Release'
        type: boolean
        default: false
      release_notes:
        description: 'Release 说明（可选）'
        required: false
        type: string

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          # Accept licenses
          yes | "${SDKMANAGER}" --licenses > /dev/null 2>&1 || true
          # Install required platform and build-tools
          "${SDKMANAGER}" "platforms;android-36" "build-tools;36.1.1"

      - name: Create local.properties
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          echo "SDK directory: ${SDK_DIR}"
          echo "sdk.dir=${SDK_DIR}" > local.properties

      - name: Create .env file
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "GEMINI_API_KEY=${GEMINI_API_KEY}" > .env

      - name: Setup Google Services
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON}" ]; then
            echo "${GOOGLE_SERVICES_JSON}" > app/google-services.json
            echo "google-services.json created from secret"
          else
            echo "No GOOGLE_SERVICES_JSON secret found, skipping (project allows missing google-services.json)"
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is not set!"
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 -d > app/upload-keystore.jks
          echo "Keystore decoded successfully"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build APK
        if: ${{ github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both' }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Build AAB
        if: ${{ github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both' }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload APK artifacts
        if: ${{ github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload AAB artifacts
        if: ${{ github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 90

      - name: Determine Release Files
        id: release-files
        if: ${{ github.event.inputs.create_release == 'true' }}
        run: |
          FILES=""
          if [ "${{ github.event.inputs.build_type }}" = "apk" ] || [ "${{ github.event.inputs.build_type }}" = "both" ]; then
            FILES="$FILES app/build/outputs/apk/release/*.apk"
          fi
          if [ "${{ github.event.inputs.build_type }}" = "aab" ] || [ "${{ github.event.inputs.build_type }}" = "both" ]; then
            FILES="$FILES app/build/outputs/bundle/release/*.aab"
          fi
          echo "files=${FILES}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: ${{ github.event.inputs.create_release == 'true' && github.event.inputs.version_name != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version_name }}
          name: v${{ github.event.inputs.version_name }}
          body: ${{ github.event.inputs.release_notes }}
          files: ${{ steps.release-files.outputs.files }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
